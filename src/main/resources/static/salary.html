<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Salary Tax Calculator</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
	<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
	<style>
		.rule-list { margin: 0; padding: 0; list-style: none; }
		.rule-list li { padding: 0.25rem 0; border-bottom: 1px solid var(--pico-muted-border-color); }
		.rule-list li:last-child { border-bottom: none; }
		.rule-number { font-weight: bold; margin-right: 0.5rem; color: var(--pico-primary); }
		.rule-effect { font-size: 0.875rem; color: var(--pico-muted-color); }
		.rule-adjustment { font-weight: bold; }
		.rule-adjustment.positive { color: #c0392b; }
		.rule-adjustment.negative { color: #27ae60; }
		.summary-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem; text-align: center; }
		.summary-card { padding: 1rem; border-radius: var(--pico-border-radius); background: var(--pico-card-background-color); border: 1px solid var(--pico-muted-border-color); }
		.summary-card h3 { margin-bottom: 0.25rem; font-size: 0.875rem; color: var(--pico-muted-color); }
		.summary-card p { margin: 0; font-size: 1.5rem; font-weight: bold; }
		.error-box { color: #c0392b; background: #fdecea; padding: 1rem; border-radius: var(--pico-border-radius); }
	</style>
</head>
<body>
<main class="container" x-data="salaryApp()">

	<hgroup>
		<h1>Salary Tax Calculator</h1>
		<p>Calculate tax for an employee using 30 tax rules</p>
	</hgroup>

	<form @submit.prevent="calculate()">
		<fieldset>
			<label>
				Employee
				<select x-model="form.employeeId" required :aria-busy="loadingEmployees">
					<option value="" disabled selected>Select an employee...</option>
					<template x-for="emp in employees" :key="emp.id">
						<option :value="emp.id" x-text="formatEmployee(emp)"></option>
					</template>
				</select>
			</label>

			<div class="grid">
				<label>
					Salary Amount
					<input type="number" step="0.01" min="0.01" x-model="form.amount" placeholder="e.g. 5000" required>
				</label>
				<label>
					Commission <small>(optional)</small>
					<input type="number" step="0.01" min="0" x-model="form.commission" placeholder="e.g. 2000">
				</label>
			</div>
		</fieldset>

		<button type="submit" :aria-busy="loading" :disabled="loading">
			<span x-show="!loading">Calculate Tax</span>
			<span x-show="loading">Calculating...</span>
		</button>
	</form>

	<!-- Error -->
	<template x-if="error">
		<div class="error-box" x-text="error"></div>
	</template>

	<!-- Result -->
	<template x-if="result">
		<article>
			<header>
				<h2>Tax Calculation for <span x-text="result.employeeName"></span></h2>
				<small>Record ID: <span x-text="result.salaryRecordId"></span></small>
			</header>

			<div class="summary-grid">
				<div class="summary-card">
					<h3>Gross Salary</h3>
					<p x-text="'$' + Number(result.grossSalary).toLocaleString('en-US', {minimumFractionDigits: 2})"></p>
				</div>
				<div class="summary-card">
					<h3>Tax</h3>
					<p style="color: #c0392b" x-text="'$' + Number(result.tax).toLocaleString('en-US', {minimumFractionDigits: 2})"></p>
				</div>
				<div class="summary-card">
					<h3>Net Salary</h3>
					<p style="color: #27ae60" x-text="'$' + Number(result.netSalary).toLocaleString('en-US', {minimumFractionDigits: 2})"></p>
				</div>
			</div>

			<h3 x-text="'Applied Rules (' + result.appliedRules.length + ')'"></h3>
			<template x-if="result.appliedRules.length === 0">
				<p>No special rules applied. Only the base 10% tax rate was used.</p>
			</template>
			<ul class="rule-list">
				<template x-for="rule in result.appliedRules" :key="rule.ruleNumber">
					<li>
						<span class="rule-number" x-text="'#' + rule.ruleNumber"></span>
						<strong x-text="rule.ruleName"></strong>
						<br>
						<span class="rule-effect" x-text="rule.effect"></span>
						&mdash;
						<span class="rule-adjustment"
							  :class="{ positive: Number(rule.adjustment) > 0, negative: Number(rule.adjustment) < 0 }"
							  x-text="(Number(rule.adjustment) >= 0 ? '+$' : '-$') + Math.abs(Number(rule.adjustment)).toLocaleString('en-US', {minimumFractionDigits: 2})">
						</span>
					</li>
				</template>
			</ul>

			<footer>
				<small>Employee ID: <span x-text="result.employeeId"></span></small>
			</footer>
		</article>
	</template>

</main>

<script>
function salaryApp() {
	return {
		employees: [],
		loadingEmployees: true,
		loading: false,
		error: null,
		result: null,
		form: {
			employeeId: '',
			amount: '',
			commission: ''
		},

		async init() {
			try {
				const res = await fetch('/api/employees');
				this.employees = await res.json();
			} catch (e) {
				this.error = 'Failed to load employees: ' + e.message;
			} finally {
				this.loadingEmployees = false;
			}
		},

		formatEmployee(emp) {
			let label = emp.name;
			if (emp.department && emp.department.name) label += ' (' + emp.department.name + ')';
			if (emp.location) label += ' - ' + emp.location;
			return label;
		},

		async calculate() {
			this.error = null;
			this.result = null;
			this.loading = true;

			const body = { amount: parseFloat(this.form.amount) };
			if (this.form.commission) {
				body.commission = parseFloat(this.form.commission);
			}

			try {
				const res = await fetch('/salary/' + this.form.employeeId, {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify(body)
				});

				if (!res.ok) {
					if (res.status === 404) throw new Error('Employee not found');
					const text = await res.text();
					throw new Error(text || 'Server error (' + res.status + ')');
				}

				this.result = await res.json();
			} catch (e) {
				this.error = e.message;
			} finally {
				this.loading = false;
			}
		}
	};
}
</script>
</body>
</html>
